name: test-module-template

on:
  workflow_call:
    inputs:
      module_name:
        required: true
        type: string
      paths_json:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check semgrep==1.167.0
      - name: Scan JavaScript with Semgrep
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --config p/javascript --metrics=off .
      - run: npm run build
      - run: npm run lint
