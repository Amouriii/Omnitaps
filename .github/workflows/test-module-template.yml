name: test-module-template

on:
  workflow_call:
    inputs:
      module_name:
        required: true
        type: string
      paths_json:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx semgrep --config p/javascript
      - run: npm run build
      - run: npm run lint
