name: OmniTaps
options:
  bundleIdPrefix: com.onouh
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  OmniTaps:
    type: application
    platform: iOS
    sources:
      - path: OMNITapsKit
        excludes:
          - Info.plist
          - Entitlements.plist
      - path: ../shared
      # Generated by stage-web.sh; folder reference keeps www/ as a directory
      # so Bundle.main.resourceURL/www resolves at runtime.
      - path: ../build/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onouh.omnitaps
        PRODUCT_NAME: OmniTaps
        INFOPLIST_FILE: OMNITapsKit/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: OMNITapsKit/Entitlements.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Local distribution only: ad-hoc identity by default. Override with
        # CODE_SIGN_IDENTITY="Apple Development" DEVELOPMENT_TEAM=XXXXXXXXXX
        # for a device install signed by your team.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  OmniTaps:
    build:
      targets:
        OmniTaps: all
    run:
      config: Debug
    archive:
      config: Release
